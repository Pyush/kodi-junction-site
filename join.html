<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join a Kodi Junction match</title>
<meta property="og:title" content="Join my Kodi Junction match">
<meta property="og:description" content="Tap to open the game and join my room.">
<style>
  :root { --night: #14060f; --panel: #26101f; --gold: #f6c744; --gold-light: #ffe9a8; --text: #fff4dc; --soft: rgba(255, 244, 220, 0.75); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 20%, #5a0f24, var(--night) 70%); color: var(--text); font: 16px/1.5 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 28px 20px; text-align: center; box-shadow: 0 0 40px rgba(246, 199, 68, 0.25); }
  h1 { margin: 0 0 4px; color: var(--gold); font-size: 1.6rem; }
  p { margin: 0 0 18px; color: var(--soft); }
  .code { display: flex; gap: 6px; justify-content: center; margin: 4px 0 22px; }
  .code span { width: 44px; height: 54px; border: 2px solid #a9741a; border-radius: 10px; background: rgba(0, 0, 0, 0.3); color: var(--gold-light); font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .code span:nth-child(4) { margin-left: 8px; }
  a.button { display: block; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 1.05rem; text-decoration: none; margin-bottom: 12px; }
  .open { background: #c62b3a; color: #fff; box-shadow: 0 5px 0 #7d1822; }
  .store { background: #0f9d8c; color: #fff; box-shadow: 0 5px 0 #08584f; }
  small { display: block; color: var(--soft); margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Kodi Junction</h1>
  <p id="lead">You're invited to a match!</p>
  <div class="code" id="code" aria-label="Room code"></div>
  <a class="button open" id="open" href="#">Open the game</a>
  <a class="button store" id="store" href="https://play.google.com/store/apps/details?id=com.kodijunction.app">Get it on Google Play</a>
  <small id="manual">Or open the game, tap Play Online, then Join Room, and enter the code.</small>
</main>
<script>
  (function () {
    var text = {
      en: { lead: "You're invited to a match!", open: 'Open the game', store: 'Get it on Google Play', manual: 'Or open the game, tap Play Online, then Join Room, and enter the code.', broken: 'This invite link is incomplete. Ask your friend for the room code.' },
      hi: { lead: 'आपको एक मैच में बुलाया गया है!', open: 'गेम खोलें', store: 'Google Play से पाएं', manual: 'या गेम खोलें, ऑनलाइन खेलें → रूम में जुड़ें पर टैप करें और कोड डालें।', broken: 'यह लिंक अधूरा है। अपने दोस्त से रूम कोड माँगें।' },
      gu: { lead: 'તમને એક મેચમાં બોલાવ્યા છે!', open: 'ગેમ ખોલો', store: 'Google Play પરથી મેળવો', manual: 'અથવા ગેમ ખોલો, ઓનલાઇન રમો → રૂમમાં જોડાઓ પર ટૅપ કરી કોડ નાખો.', broken: 'આ લિંક અધૂરી છે. તમારા મિત્ર પાસે રૂમ કોડ માંગો.' }
    };
    var lang = (navigator.language || 'en').slice(0, 2);
    var t = text[lang] || text.en;
    document.documentElement.lang = text[lang] ? lang : 'en';
    document.getElementById('lead').textContent = t.lead;
    document.getElementById('open').textContent = t.open;
    document.getElementById('store').textContent = t.store;
    document.getElementById('manual').textContent = t.manual;

    var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    var open = document.getElementById('open');
    var store = document.getElementById('store');
    if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
      document.getElementById('lead').textContent = t.broken;
      open.hidden = true;
      return;
    }

    var box = document.getElementById('code');
    code.split('').forEach(function (c) {
      var cell = document.createElement('span');
      cell.textContent = c;
      box.appendChild(cell);
    });

    // A fresh install learns the room from Google Play's install referrer.
    var play = 'https://play.google.com/store/apps/details?id=com.kodijunction.app&referrer=' +
      encodeURIComponent('room=' + code);
    store.href = play;

    if (/android/i.test(navigator.userAgent)) {
      // Opens the game if it's installed, or Google Play if it isn't.
      open.href = 'intent://join/' + code + '#Intent;scheme=kodijunction;package=com.kodijunction.app;' +
        'S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
      // Some in-app browsers only allow this from a tap, hence the button.
      location.href = open.href;
    } else {
      open.hidden = true;
    }
  })();
</script>
</body>
</html>
